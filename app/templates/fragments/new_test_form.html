{% if test %}
<span class="modal-eyebrow" id="modal-eyebrow" hx-swap-oob="true">Изменение теста</span>
<div class="modal-test-path">Тест — {{ agent.name }}</div>
{% else %}
<span class="modal-eyebrow" id="modal-eyebrow" hx-swap-oob="true">Новый тест</span>
<div class="modal-test-path">Новый тест — {{ agent.name }}</div>
{% endif %}

<form id="new-test-form">
  <div class="field">
    <label for="new-test-path">Путь теста</label>
    <input id="new-test-path" name="path" type="text" required{% if test %} value="{{ test.path }}"{% endif %}>
  </div>

  <div class="section-label">Параметры</div>
  <div id="new-test-fields"></div>
  <button type="button" class="btn-secondary" id="new-test-add-row" style="width:auto; margin-bottom:14px">+ Добавить параметр</button>

  <div class="section-label">Фиксированные флаги</div>
  <div id="new-test-flags"></div>
  <button type="button" class="btn-secondary" id="new-test-add-flag" style="width:auto; margin-bottom:14px">+ Добавить флаг</button>

  <div class="modal-foot">
    <button type="button" class="btn-secondary modal-cancel">Отмена</button>
    <button type="submit" class="btn-primary" id="new-test-submit" style="width:auto">{{ "Сохранить" if test else "Создать" }}</button>
  </div>
</form>
<script>
(function () {
  var container = document.getElementById("new-test-fields");

  function addRow(data) {
    var row = document.createElement("div");
    row.className = "def-row field-row";
    row.innerHTML =
      '<input type="text" placeholder="Метка" class="def-input def-wide f-label">' +
      '<input type="text" placeholder="--flag" class="def-input def-wide f-flag">' +
      '<select class="def-input f-type">' +
        '<option value="text">text</option>' +
        '<option value="number">number</option>' +
        '<option value="checkbox">checkbox</option>' +
      '</select>' +
      '<label class="def-check">' +
        '<input type="checkbox" class="f-required">обяз.</label>' +
      '<button type="button" class="btn-secondary def-remove remove-row">✕</button>';
    if (data) {
      row.querySelector(".f-label").value = data.label || "";
      row.querySelector(".f-flag").value = data.flag_name || "";
      row.querySelector(".f-type").value = data.type || "text";
      row.querySelector(".f-required").checked = !!data.required;
      // Not editable here, but kept so saving doesn't drop it.
      if (data.options) row.dataset.options = JSON.stringify(data.options);
    }
    container.appendChild(row);
  }

  document.getElementById("new-test-add-row").addEventListener("click", function () { addRow(); });
  container.addEventListener("click", function (e) {
    var btn = e.target.closest(".remove-row");
    if (btn) btn.closest(".field-row").remove();
  });

  // Fixed flags are always added to the command. A value flag named like a
  // parameter above only fills that parameter when it's left empty.
  var flagsContainer = document.getElementById("new-test-flags");

  function addFlagRow(data) {
    var row = document.createElement("div");
    row.className = "def-row flag-row";
    row.innerHTML =
      '<input type="text" placeholder="--flag" class="def-input def-wide fl-name">' +
      '<select class="def-input fl-kind">' +
        '<option value="bool">без значения</option>' +
        '<option value="value">со значением</option>' +
      '</select>' +
      '<input type="text" placeholder="значение" class="def-input def-wide fl-default" disabled>' +
      '<button type="button" class="btn-secondary def-remove remove-flag">✕</button>';
    if (data) {
      row.querySelector(".fl-name").value = data.name || "";
      row.querySelector(".fl-kind").value = data.kind === "value" ? "value" : "bool";
      var defaultInput = row.querySelector(".fl-default");
      defaultInput.disabled = data.kind !== "value";
      defaultInput.value = data.kind === "value" && data.default ? data.default : "";
    }
    flagsContainer.appendChild(row);
  }

  document.getElementById("new-test-add-flag").addEventListener("click", function () { addFlagRow(); });
  flagsContainer.addEventListener("click", function (e) {
    var btn = e.target.closest(".remove-flag");
    if (btn) btn.closest(".flag-row").remove();
  });
  flagsContainer.addEventListener("change", function (e) {
    if (!e.target.classList.contains("fl-kind")) return;
    var input = e.target.closest(".flag-row").querySelector(".fl-default");
    input.disabled = e.target.value === "bool";
    if (input.disabled) input.value = "";
  });

  {% if test %}
  {{ test.fields | tojson }}.forEach(addRow);
  {{ test.flags | tojson }}.forEach(addFlagRow);
  var url = "/api/agent-tests/{{ test.id }}", method = "PUT", failText = "Не удалось сохранить тест";
  {% else %}
  addRow();
  var url = "/api/agents/{{ agent.id }}/tests", method = "POST", failText = "Не удалось создать тест";
  {% endif %}

  var form = document.getElementById("new-test-form");
  var submitBtn = document.getElementById("new-test-submit");
  formError.bind(form);
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    formError.clear(form);
    var fields = [];
    container.querySelectorAll(".field-row").forEach(function (row) {
      var flag = row.querySelector(".f-flag").value.trim();
      if (!flag) return;
      fields.push({
        label: row.querySelector(".f-label").value.trim() || flag,
        flag_name: flag,
        type: row.querySelector(".f-type").value,
        required: row.querySelector(".f-required").checked,
        options: row.dataset.options ? JSON.parse(row.dataset.options) : null,
      });
    });
    var flags = [];
    flagsContainer.querySelectorAll(".flag-row").forEach(function (row) {
      var name = row.querySelector(".fl-name").value.trim();
      if (!name) return;
      var kind = row.querySelector(".fl-kind").value;
      var value = row.querySelector(".fl-default").value.trim();
      flags.push({ name: name, kind: kind, default: kind === "value" && value ? value : null });
    });
    submitBtn.disabled = true;
    fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: form.elements["path"].value, flags: flags, fields: fields }),
    }).then(function (resp) {
      if (resp.ok) {
        location.reload();
        return;
      }
      submitBtn.disabled = false;
      formError.fromResponse(resp, failText).then(function (message) {
        formError.show(form, message);
      });
    }).catch(function (err) {
      submitBtn.disabled = false;
      formError.show(form, failText + ": " + err);
    });
  });
})();
</script>
