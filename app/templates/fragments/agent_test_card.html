<div>
  <h3>{{ test.path }}</h3>
  <table>
    {% for flag in test.flags %}
      {% include "fragments/flag_row.html" %}
    {% endfor %}
  </table>
  <table>
    {% for field in test.fields %}
      {% include "fragments/field_row.html" %}
    {% endfor %}
  </table>
  <form id="launch-form-{{ test.id }}" data-launch-url="/api/agent-tests/{{ test.id }}/launch">
    {% for field in test.fields %}
      <label>{{ field.label }}
        <input name="{{ field.flag_name }}" type="{{ 'checkbox' if field.type == 'checkbox' else 'text' }}" {{ 'required' if field.required }}>
      </label>
    {% endfor %}
    <button type="submit">Запустить</button>
  </form>
</div>
<script>
(function () {
  // The launch endpoint (POST /api/agent-tests/{id}/launch) requires a JSON
  // body shaped {"values": {<flag_name>: <value>, ...}} — htmx's default
  // form encoding is application/x-www-form-urlencoded, and unchecked
  // checkboxes are omitted entirely by native form serialization. Build the
  // nested JSON payload by hand instead, reading `.checked` explicitly for
  // checkbox fields so an unchecked boolean flag is still sent (as false)
  // rather than silently dropped.
  var form = document.getElementById("launch-form-{{ test.id }}");
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var values = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (!el.name) return;
      values[el.name] = el.type === "checkbox" ? el.checked : el.value;
    });
    fetch(form.dataset.launchUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ values: values }),
    }).then(function (resp) {
      if (resp.ok && window.htmx) {
        htmx.ajax("GET", "/jobs/fragments/list", { target: "#job-list", swap: "outerHTML" });
      }
    });
  });
})();
</script>
